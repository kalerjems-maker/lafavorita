<script>
// Puente: estas pantallas viven guardadas en el celular y hablan con Google por internet
(function(){
  var LECT = ['gastosFijos','historial','buscarQR','inicio','leerDia','cuentas','proveedores','panel','precios','catalogo','catalogoAdmin'];
  function clave(a){ return 'favorita_c_' + a[1] + '_' + JSON.stringify(a[2] || []); }
  function leer(k){ try { var x = localStorage.getItem(k); return x ? JSON.parse(x) : undefined; } catch (e) { return undefined; } }
  function guardar(k, v){
    try { localStorage.setItem(k, JSON.stringify(v)); }
    catch (e) { try { Object.keys(localStorage).forEach(function(x){ if (x.indexOf('favorita_c_') === 0) localStorage.removeItem(x); }); localStorage.setItem(k, JSON.stringify(v)); } catch (e2) {} }
  }
  function aviso(){
    if (document.getElementById('pt-aviso')) return;
    var d = document.createElement('div'); d.id = 'pt-aviso';
    d.textContent = '📴 Sin internet: está viendo lo último que se cargó';
    d.style.cssText = 'position:fixed;left:10px;right:10px;top:10px;z-index:99999;background:#9B2C22;color:#fff;font:600 15px Arial,sans-serif;padding:10px 12px;border-radius:12px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)';
    (document.body || document.documentElement).appendChild(d);
    setTimeout(function(){ d.remove(); }, 5000);
  }
  function llamar(fn, args, ok, mal){
    var lect = fn === 'api' && LECT.indexOf(args[1]) >= 0, k = lect ? clave(args) : '', viejo = lect ? leer(k) : undefined;
    function falla(m){ if (mal) mal(new Error(m)); }
    function sinSenal(){
      if (viejo !== undefined) { aviso(); if (ok) ok(viejo); return; }
      falla('Failed to fetch: sin conexión');
    }
    if (!window.APP_URL || APP_URL.indexOf('/exec') < 0) { falla('Falta pegar la URL de la app en config.js'); return; }
    if (!navigator.onLine) { setTimeout(sinSenal, 0); return; }
    var ctl = window.AbortController ? new AbortController() : null, t = ctl ? setTimeout(function(){ ctl.abort(); }, lect ? 30000 : 180000) : 0;
    fetch(APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: fn, args: args }), signal: ctl ? ctl.signal : undefined, redirect: 'follow' })
      .then(function(r){ return r.text(); })
      .then(function(tx){
        clearTimeout(t);
        var j; try { j = JSON.parse(tx); } catch (e) { falla('El servidor no respondió bien. Revise que la app esté implementada para "Cualquier usuario".'); return; }
        if (!j.ok) { falla(j.err || 'Error'); return; }
        if (lect) guardar(k, j.r === undefined ? null : j.r);
        if (ok) ok(j.r);
      })
      .catch(function(){ clearTimeout(t); sinSenal(); });
  }
  function runner(ok, mal){
    return new Proxy({}, { get: function(_, k){
      if (k === 'withSuccessHandler') return function(f){ return runner(f, mal); };
      if (k === 'withFailureHandler') return function(f){ return runner(ok, f); };
      if (k === 'withUserObject') return function(){ return runner(ok, mal); };
      return function(){ llamar(k, [].slice.call(arguments), ok, mal); };
    }});
  }
  function lugar(){
    var p = {}, ps = {};
    new URLSearchParams(location.search).forEach(function(v, k){ if (!(k in p)) p[k] = v; (ps[k] = ps[k] || []).push(v); });
    return { parameter: p, parameters: ps, hash: location.hash.replace(/^#/, '') };
  }
  window.google = { script: { run: runner(null, null), url: { getLocation: function(cb){ setTimeout(function(){ cb(lugar()); }, 0); } } } };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>

<script>
var URL_APP = './', PIN = '', ROL = null;
var EQUIPO = 'x';
try { PIN = localStorage.getItem('favorita_pin') || ''; } catch (e) {}
try {
  EQUIPO = localStorage.getItem('favorita_equipo') || '';
  if (!EQUIPO) { EQUIPO = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem('favorita_equipo', EQUIPO); }
} catch (e) { EQUIPO = 'x'; }
function llaveQR(){ return (ROL && ROL.llave) || '@jemsh6074'; }
function conEquipo(p){ return p ? p + '#' + EQUIPO : ''; }
function cmG(id){ return document.getElementById(id); }
// Dentro de la PWA (app instalada): los enlaces entre pantallas se abren dentro de la misma app
var PWA = '0' === '1';
if (PWA) document.addEventListener('click', function(ev){
  var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
  if (!a || a.target === '_blank') return;
  var h = a.getAttribute('href') || '';
  if (h.indexOf(URL_APP) !== 0) return;
  ev.preventDefault();
  try { window.top.postMessage({ favorita: 'ir', q: h.slice(URL_APP.length) }, '*'); } catch (e) {}
}, true);
// Mensajes de WhatsApp: primer nombre bonito ("JHONATAN PEREZ" -> "Jhonatan")
function nomCorto(n){ var p = String(n || '').trim().split(/\s+/)[0] || ''; return p.charAt(0).toUpperCase() + p.slice(1).toLowerCase(); }
function saludoWa(n){ return '¡Hola' + (n ? ' ' + nomCorto(n) : '') + '! 👋 Le saluda *Tienda La Favorita* 🐔✨'; }
var GRACIAS_WA = '¡Gracias por seguir prefiriéndonos! 🙏💛';
// Línea para pagar desde la casa: llave Bre-B + página con el QR
function pagoWa(n, v){
  return '📲 *Puede pagar desde su casa:*\n🔑 Llave Bre-B: *' + llaveQR() + '*\n🧾 Nuestro QR 👉 ' + (window.APP_URL || URL_APP) + '?p=pagar&n=' + encodeURIComponent(nomCorto(n)) + '&v=' + Math.round(v || 0);
}
function msgAbono(nombre, valor, medio, saldo, fecha){
  var f = String(fecha || '').split('-');
  return saludoWa(nombre) + '\n\nRecibimos su abono, ¡muchas gracias! 🙌\n' + (f.length === 3 ? '📅 ' + f[2] + '/' + f[1] + '/' + f[0] + '\n' : '') +
    '💵 Abono: *$' + sep(valor) + '* (' + medio + ')\n' +
    (saldo > 0 ? '💰 Le queda pendiente: *$' + sep(saldo) + '*' : '🎉 ¡Quedó a paz y salvo! Su cuenta está en cero.') +
    '\n\n' + GRACIAS_WA;
}
function guardarPin(p){ PIN = p; try { localStorage.setItem('favorita_pin', p); } catch (e) {} }
function salir(){ try { localStorage.removeItem('favorita_pin'); localStorage.removeItem('favorita_rol'); localStorage.removeItem('favorita_inicio'); } catch (e) {} PIN = ''; }
// ----- Sin internet: lo que se guarda queda en el celular y se manda solo cuando vuelve la señal -----
var COLA_FN = { guardarCuadre: 1, guardarMov: 1, guardarPago: 1 }, ENVIANDO = false, OK_HASTA = 0;
function sinRed(e){ return !navigator.onLine || /NetworkError|HTTP 0|network|Failed to fetch|conexi[oó]n/i.test((e && e.message) || ''); }
function leerCola(){ try { return JSON.parse(localStorage.getItem('favorita_cola') || '[]'); } catch (e) { return []; } }
function escribirCola(c){ try { localStorage.setItem('favorita_cola', JSON.stringify(c)); } catch (e) {} pintarCola(); }
function aCola(fn, args){
  var a = args[0], h = new Date();
  a.hora = ('0' + h.getHours()).slice(-2) + ':' + ('0' + h.getMinutes()).slice(-2) + ':' + ('0' + h.getSeconds()).slice(-2);
  OK_HASTA = 0;
  var c = leerCola(); c.push({ fn: fn, args: args, k: a._k }); escribirCola(c);
}
function pintarCola(){
  var el = cmG('cm-cola'); if (!el || Date.now() < OK_HASTA) return;
  var n = leerCola().length, sin = !navigator.onLine;
  el.hidden = !n && !sin;
  el.className = sin ? 'sin' : '';
  var cosas = n + (n === 1 ? ' cosa' : ' cosas');
  el.textContent = sin ? '📴 Sin internet' + (n ? ' · ' + cosas + ' por enviar. No cierre la app' : '')
    : ENVIANDO ? '⏳ Enviando ' + cosas + ' guardadas sin internet...' : '⏳ ' + cosas + ' por enviar · se reintenta sola';
}
function enviarCola(){
  pintarCola();
  if (ENVIANDO || !navigator.onLine || !PIN) return;
  var c = leerCola(); if (!c.length) return;
  var it = c[0]; ENVIANDO = true; pintarCola();
  google.script.run.withSuccessHandler(function(){
    ENVIANDO = false;
    escribirCola(leerCola().filter(function(x){ return x.k !== it.k; }));
    if (!leerCola().length) { var el = cmG('cm-cola'); el.hidden = false; el.className = ''; el.textContent = '✅ Ya se envió todo lo guardado sin internet'; OK_HASTA = Date.now() + 4000; setTimeout(pintarCola, 4100); return; }
    enviarCola();
  }).withFailureHandler(function(e){
    ENVIANDO = false;
    if (sinRed(e) || /Clave|intentos/.test(e.message || '')) { pintarCola(); return; }   // se reintenta después
    escribirCola(leerCola().filter(function(x){ return x.k !== it.k; }));
    alert('No se pudo enviar algo guardado sin internet (' + it.fn + ' ' + JSON.stringify(it.args[0]).slice(0, 120) + '): ' + e.message + '. Anótelo de nuevo.');
    enviarCola();
  }).api(conEquipo(PIN), it.fn, it.args);
}
window.addEventListener('online', enviarCola);
window.addEventListener('offline', function(){ OK_HASTA = 0; pintarCola(); });
setInterval(enviarCola, 20000);
setTimeout(enviarCola, 1500);

// Igual que google.script.run, pero pasa la clave al servidor
function srv(){
  var ok = null, mal = null;
  var o = { withSuccessHandler: function(f){ ok = f; return p; }, withFailureHandler: function(f){ mal = f; return p; } };
  var p = new Proxy(o, { get: function(t, k){
    if (k in t) return t[k];
    return function(){
      var args = [].slice.call(arguments), cola = COLA_FN[k] && args[0] && typeof args[0] === 'object';
      if (cola && !args[0]._k) args[0]._k = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      var guardarSinRed = function(){
        aCola(k, args);
        if (mal) mal({ cola: true, message: '📴 Sin internet: quedó guardado en el celular y se envía solo cuando vuelva la señal. No cierre la app.' });
      };
      if (cola && !navigator.onLine) { guardarSinRed(); return; }
      var r = google.script.run;
      if (ok) r = r.withSuccessHandler(ok);
      r = r.withFailureHandler(function(e){
        if (cola && sinRed(e)) { guardarSinRed(); return; }
        if (/Clave incorrecta/.test(e.message)) salir();
        if (mal) mal(e);
      });
      r.api(conEquipo(PIN), k, args);
    };
  }});
  return p;
}
function mostrar(r, fn){
  ROL = r;
  cmG('cm-gate').hidden = true;
  if (r.paginas.indexOf(PAGINA) < 0) { cmG('cm-no').hidden = false; return false; }
  cmG('cm-no').hidden = true;
  cmG('cm-barra').hidden = false;
  cmG('cm-volver').hidden = PAGINA === 'inicio';
  cmG('cm-quien').textContent = '🔓 ' + r.nombre;
  if (fn) fn();
  return true;
}
function iniciar(fn){
  if (!PIN) { pedirClave(fn); return; }
  var guardado = null;
  try { guardado = JSON.parse(localStorage.getItem('favorita_rol') || 'null'); } catch (e) {}
  // Si ya se conoce la clave, la pantalla arranca de una vez y se verifica al mismo tiempo
  var ya = guardado ? mostrar(guardado, fn) : false;
  google.script.run.withSuccessHandler(function(r){
    if (r && r.bloqueado) { salir(); pedirClave(fn, '⛔ Demasiados intentos. Espere ' + r.bloqueado + ' min.'); return; }
    if (!r) { salir(); pedirClave(fn, 'La clave cambió. Escríbala de nuevo.'); return; }
    try { localStorage.setItem('favorita_rol', JSON.stringify(r)); } catch (e) {}
    if (!guardado) mostrar(r, fn);
    else if (JSON.stringify(guardado) !== JSON.stringify(r)) mostrar(r, ya ? null : fn);   // si con lo guardado no podía entrar y ahora sí, carga
  }).withFailureHandler(function(e){
    if (!guardado) pedirClave(fn, 'Sin conexión. Intente otra vez.');
  }).api(conEquipo(PIN), 'rol', []);
}
function pedirClave(fn, aviso){
  var g = cmG('cm-gate'), dig = '';
  g.hidden = false; cmG('cm-err').textContent = aviso || '';
  var puntos = cmG('cm-puntos').children;
  function pintar(){ for (var i = 0; i < 4; i++) puntos[i].className = i < dig.length ? 'on' : ''; }
  pintar();
  g.querySelectorAll('.cm-teclas button').forEach(function(b){
    b.onclick = function(){
      if (b.getAttribute('data-k') === 'borrar') { dig = dig.slice(0, -1); pintar(); return; }
      if (dig.length >= 4) return;
      dig += b.textContent; pintar(); cmG('cm-err').textContent = '';
      if (dig.length === 4) {
        cmG('cm-err').textContent = 'Revisando...';
        google.script.run.withSuccessHandler(function(r){
          if (r && r.bloqueado) { dig = ''; pintar(); cmG('cm-err').textContent = '⛔ Demasiados intentos. Espere ' + r.bloqueado + ' min.'; return; }
          if (!r) { dig = ''; pintar(); cmG('cm-err').textContent = 'Clave incorrecta'; return; }
          guardarPin(dig); iniciar(fn);
        }).withFailureHandler(function(){ dig = ''; pintar(); cmG('cm-err').textContent = 'Sin conexión. Intente otra vez.'; })
          .api(conEquipo(dig), 'rol', []);
      }
    };
  });
}
</script>

<h1>Precios de proveedores</h1>

<div class="tipos" id="modos">

    <div class="card" id="ranking"></div>
    <h2>⚠️ Subieron de precio (últimos 45 días)</h2>

  </div>
</div>

<!-- ===== ANOTAR FACTURA ===== -->
<div id="fAnotar" hidden>
  <button type="button" class="ia" id="btnIA">📷 LEER FACTURA CON FOTO<small>La inteligencia artificial llena todo por usted</small></button>
  <input type="file" id="fotoIA" accept="image/*" capture="environment" hidden>
  <div class="aviso" id="avisoIA" hidden></div>
  <label for="aProv">🚚 Proveedor</label>
  <input id="aProv" list="dlProvs" autocomplete="off">
  <label>📂 Qué es</label>
  <div class="chips" id="aTipo">
    <button type="button" class="on" data-v="Compra">🛒 Factura de compra</button>
    <button type="button" data-v="Cotización">💬 Solo cotización</button>
  </div>

      <button type="button" data-v="">No, todavía</button>
      <button type="button" class="on" data-v="Caja">💵 De la caja</button>
      <button type="button" data-v="Transferencia">🏦 Transferencia</button>

  <button id="btnGuardar">GUARDAR</button>
</div>

<div id="msg"></div>
<datalist id="dlProvs"></datalist>
<datalist id="dlProds"></datalist>

<script>
var PAGINA = 'precios';
var D = { productos: [], ranking: [], subidas: [], provs: [] }, tipo = 'Compra', pago = 'Caja', nLinea = 0, fotoUrl = '';
function $(id){ return document.getElementById(id); }
function num(x){ return typeof x === 'number' ? x : (Number(String(x || '').replace(/\D/g, '')) || 0); }
function sep(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function fmt(n){ return (n < 0 ? '-$' : '$') + sep(Math.abs(n)); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function msg(t, c){ $('msg').textContent = t; $('msg').className = c || ''; }
function hoy(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fCorta(f){ var p = f.split('-'); return p[2] + '/' + p[1]; }
function sinTilde(s){ return String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function chips(id, fn){
  document.querySelectorAll('#' + id + ' button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#' + id + ' button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); fn(b.getAttribute('data-v'));
    });
  });
}
function marcar(id, v){ document.querySelectorAll('#' + id + ' button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === v); }); }

// ---------- Modo ----------
function setModo(m){
  document.querySelectorAll('#modos button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-m') === m); });
  $('fComparar').hidden = m !== 'comparar'; $('fAnotar').hidden = m !== 'anotar'; msg('');
  if (m === 'anotar' && !$('lineas').children.length) agregarLinea();
}
document.querySelectorAll('#modos button').forEach(function(b){ b.addEventListener('click', function(){ setModo(b.getAttribute('data-m')); }); });
chips('aTipo', function(v){ tipo = v; $('boxPago').hidden = v !== 'Compra'; $('boxPagado').hidden = v !== 'Compra'; $('btnGuardar').textContent = v === 'Compra' ? 'GUARDAR FACTURA' : 'GUARDAR COTIZACIÓN'; revisarTodas(); });
chips('aPago', function(v){ pago = v; });

// ---------- Comparar ----------
function tarjeta(p){
  var mejor = p.ofertas[0], h = '<div class="card"><div class="t">' + esc(p.n) + '</div>' + (p.u ? '<div class="u">' + esc(p.u) + '</div>' : '');
  p.ofertas.forEach(function(o, i){
    var dif = o.precio - mejor.precio;
    h += '<div class="of' + (i === 0 && p.ofertas.length > 1 ? ' gana' : '') + '"><div class="p">' + (i === 0 && p.ofertas.length > 1 ? '🥇 ' : '') + esc(o.prov) +
      (o.tipo === 'Cotización' ? '<span class="tag">cotización</span>' : '') + '<small>' + fCorta(o.fecha) + '</small></div><div><b>' + fmt(o.precio) + '</b>' +
      (i > 0 && dif > 0 ? '<span class="mas">+' + fmt(dif) + ' (+' + Math.round(dif / mejor.precio * 100) + '%)</span>' : '') + '</div></div>';
  });
  if (p.ofertas.length === 1) h += '<div class="u" style="margin-top:6px">Solo hay un proveedor. Pida otra cotización para comparar.</div>';
  // Ganancia: precio de venta contra lo último que se pagó
  var v = p.venta, k = esc(p.n + '|' + p.u);
  if (v && v.costo) {
    var ok = v.margen >= 0.15, medio = v.margen >= 0.08;
    h += '<div class="gan ' + (ok ? 'g-ok' : medio ? 'g-med' : 'g-mal') + '">💰 Lo vende a <b>' + fmt(v.precio) + '</b>' + (v.unid > 1 ? ' × ' + v.unid + ' = ' + fmt(v.precio * v.unid) : '') +
      '<br>Le costó ' + fmt(v.costo) + ' · gana <b>' + fmt(v.ganancia) + ' (' + Math.round(v.margen * 100) + '%)</b>' +
      (v.sugerido > v.precio ? '<br>💡 Para ganar ' + Math.round((D.margenDeseado || 0.2) * 100) + '%: véndalo a <b>' + fmt(v.sugerido) + '</b>' + (v.unid > 1 ? ' cada una' : '') : '') + '</div>';
  } else if (v) h += '<div class="gan g-ok">💰 Lo vende a <b>' + fmt(v.precio) + '</b>' + (v.unid > 1 ? ' × ' + v.unid : '') + '</div>';
  h += '<button type="button" class="ver pv" data-k="' + k + '">' + (v ? '✏️ Cambiar precio de venta' : '💰 Poner a cuánto lo vende') + '</button>' +
    '<div class="fventa" hidden><label>Precio de venta (de cada unidad que vende)</label><input class="vp" inputmode="numeric" value="' + (v ? sep(v.precio) : '') + '">' +
    '<label>¿Cuántas unidades saca de ' + esc(p.u || 'esta presentación') + '?<span class="ayuda">Ej: paca x 25 libras → 25. Si la vende entera → 1</span></label>' +
    '<input class="vu" inputmode="numeric" value="' + (v ? v.unid : 1) + '"><button type="button" class="gv">GUARDAR PRECIO DE VENTA</button></div>';
  h += '<button type="button" class="ver" data-k="' + esc(p.n + '|' + p.u) + '">Ver historial ▾</button><div class="hist" hidden></div></div>';
  return h;
}
function buscar(){
  var q = sinTilde($('buscar').value.trim());
  $('resumen').hidden = !!q;
  if (!q) { $('resultados').innerHTML = D.productos.length ? '' : '<div class="vacio">Todavía no hay precios. Toque 🧾 ANOTAR FACTURA para empezar.</div>'; return; }
  var r = D.productos.filter(function(p){ return sinTilde(p.n + ' ' + p.u).indexOf(q) >= 0; }).slice(0, 30);
  $('resultados').innerHTML = r.length ? r.map(tarjeta).join('') : '<div class="vacio">No encontré "' + esc($('buscar').value) + '"</div>';
  document.querySelectorAll('#resultados .pv').forEach(function(b){
    b.addEventListener('click', function(){ var f = b.nextElementSibling; f.hidden = !f.hidden; });
  });
  document.querySelectorAll('#resultados .gv').forEach(function(g){
    g.addEventListener('click', function(){
      var f = g.parentNode, k = f.previousElementSibling.getAttribute('data-k').split('|');
      var pr = num(f.querySelector('.vp').value), un = num(f.querySelector('.vu').value) || 1;
      if (!pr) { msg('Escriba el precio de venta', 'err'); return; }
      g.disabled = true; g.textContent = 'Guardando...';
      srv().withSuccessHandler(function(r){ pintar(r); msg('✅ Precio de venta guardado', 'ok'); })
        .withFailureHandler(function(e){ g.disabled = false; g.textContent = 'GUARDAR PRECIO DE VENTA'; msg('No se guardó: ' + e.message, 'err'); })
        .guardarVenta({ p: k[0], u: k[1], precio: pr, unid: un });
    });
  });
  document.querySelectorAll('#resultados .vp, #resultados .vu').forEach(function(i){ i.addEventListener('input', function(){ var n = num(i.value); i.value = n ? sep(n) : ''; }); });
  document.querySelectorAll('#resultados .ver:not(.pv)').forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.getAttribute('data-k'), p = D.productos.filter(function(x){ return x.n + '|' + x.u === k; })[0], box = b.nextElementSibling;
      if (!box.hidden) { box.hidden = true; b.textContent = 'Ver historial ▾'; return; }
      box.innerHTML = p.hist.map(function(x){ return '<div><span>' + fCorta(x.fecha) + ' · ' + esc(x.prov) + (x.tipo === 'Cotización' ? ' (cotiz.)' : '') + '</span><b>' + fmt(x.precio) + '</b></div>'; }).join('');
      box.hidden = false; b.textContent = 'Ocultar historial ▴';
    });
  });
}
$('buscar').addEventListener('input', buscar);

function pintar(r){
  D = r;
  $('dlProvs').innerHTML = r.provs.map(function(p){ return '<option value="' + esc(p) + '">'; }).join('');
  var vistos = {};
  $('dlProds').innerHTML = r.productos.filter(function(p){ if (vistos[p.n]) return false; vistos[p.n] = 1; return true; })
    .map(function(p){ return '<option value="' + esc(p.n) + '">'; }).join('');
  var comp = r.productos.filter(function(p){ return p.ofertas.length > 1; }).length;
  $('ranking').innerHTML = r.ranking.length
    ? '<div class="u" style="padding-bottom:6px">' + comp + ' productos tienen precio de 2 o más proveedores</div>' +
      r.ranking.map(function(x, i){ return '<div class="rank"><span>' + (i === 0 && x.barato ? '🥇 ' : '') + esc(x.prov) + '</span><span><b>' + x.barato + '</b> más barato · de ' + x.productos + '</span></div>'; }).join('')
    : '<div class="vacio">Aparece cuando haya precios de varios proveedores</div>';
  $('subidas').innerHTML = r.subidas.length
    ? r.subidas.map(function(s){ return '<div class="sube"><span>' + esc(s.n) + '<small style="display:block;color:#666;font-size:14px">' + esc(s.prov) + ' · ' + fCorta(s.fecha) + '</small></span><span style="text-align:right"><b style="color:#b3261e">+' + Math.round(s.pct * 100) + '%</b><small style="display:block;color:#666;font-size:14px">' + fmt(s.antes) + ' → ' + fmt(s.ahora) + '</small></span></div>'; }).join('')
    : '<div class="vacio">Ningún precio ha subido 👍</div>';
  $('boxRevisar').hidden = !(r.revisar && r.revisar.length);
  $('revisar').innerHTML = (r.revisar || []).map(function(x){
    return '<div class="sube"><span>' + esc(x.n) + '<small style="display:block;color:#666;font-size:14px">' + (x.subio ? '📈 Subió el costo y no ha cambiado el precio' : 'Gana menos del ' + Math.round((r.margenDeseado || 0.2) * 100) + '%') +
      '</small></span><span style="text-align:right"><b style="color:#b3261e">' + Math.round(x.margen * 100) + '%</b><small style="display:block;color:#666;font-size:14px">costo ' + fmt(x.costo) + ' · vende ' + fmt(x.venta) + '</small></span></div>' +
      (x.sugerido > x.precio ? '<div class="sug"><span>💡 Véndalo a <b>' + fmt(x.sugerido) + '</b>' + (x.unid > 1 ? ' cada una' : '') + ' <small>(hoy ' + fmt(x.precio) + ')</small></span>' +
        '<button type="button" class="usar" data-p="' + esc(x.n) + '" data-u="' + esc(x.u) + '" data-s="' + x.sugerido + '" data-n="' + x.unid + '">Usar ese precio</button></div>' : '');
  }).join('');
  document.querySelectorAll('#revisar .usar').forEach(function(b){
    b.addEventListener('click', function(){
      b.disabled = true; b.textContent = 'Guardando...';
      srv().withSuccessHandler(function(x){ pintar(x); msg('✅ Precio de venta actualizado: ' + b.getAttribute('data-p') + ' a ' + fmt(+b.getAttribute('data-s')), 'ok'); })
        .withFailureHandler(function(e){ b.disabled = false; b.textContent = 'Usar ese precio'; msg('No se guardó: ' + e.message, 'err'); })
        .guardarVenta({ p: b.getAttribute('data-p'), u: b.getAttribute('data-u'), precio: +b.getAttribute('data-s'), unid: +b.getAttribute('data-n') });
    });
  });
  buscar(); revisarTodas();
}

// ---------- Anotar factura ----------
function agregarLinea(l){
  nLinea++;
  var div = document.createElement('div');
  div.className = 'linea';
  div.innerHTML = '<span class="num">Producto ' + ($('lineas').children.length + 1) + '</span><button type="button" class="quitar">✕</button>' +
    '<label>Producto</label><input class="lp" list="dlProds" autocomplete="off" placeholder="Ej: ARROZ DIANA">' +
    '<label>Presentación<span class="ayuda">Ej: paca x 25 lb, caja x 24, unidad</span></label><input class="lu" autocomplete="off">' +
    '<div class="dos"><div><label>Cantidad</label><input class="lc" inputmode="numeric" value="1"></div>' +
    '<div><label>Precio de cada uno</label><input class="lv" inputmode="numeric"></div></div>' +
    '<div class="sub"></div><div class="pista" hidden></div>';
  $('lineas').appendChild(div);
  var lp = div.querySelector('.lp'), lu = div.querySelector('.lu');
  if (l && l.p) {
    lp.value = l.p; lu.value = l.u || '';
    div.querySelector('.lc').value = sep(l.cant || 1);
    div.querySelector('.lv').value = l.precio ? sep(l.precio) : '';
  }
  lp.addEventListener('change', function(){
    if (lu.value) return;
    var p = D.productos.filter(function(x){ return x.n === lp.value.trim().toUpperCase(); })[0];
    if (p) lu.value = p.u;
    revisar(div);
  });
  [lp, lu].forEach(function(i){ i.addEventListener('input', function(){ revisar(div); }); });
  ['.lc', '.lv'].forEach(function(c){
    var i = div.querySelector(c);
    i.addEventListener('input', function(){ var n = num(i.value); i.value = n ? sep(n) : ''; revisar(div); });
  });
  if (l) revisar(div); else lp.focus();
  div.querySelector('.quitar').addEventListener('click', function(){
    div.remove(); numerar(); pagadoEditado = false; totalizar();
    if (!$('lineas').children.length) agregarLinea();
  });
}
$('btnLinea').addEventListener('click', function(){ agregarLinea(); });
function numerar(){ [].forEach.call($('lineas').children, function(d, i){ d.querySelector('.num').textContent = 'Producto ' + (i + 1); }); }
function totalizar(){
  var t = 0;
  [].forEach.call($('lineas').children, function(d){ t += (num(d.querySelector('.lc').value) || 1) * num(d.querySelector('.lv').value); });
  $('aTotal').textContent = fmt(t);
  SUMA = t;
  if (!pagadoEditado) $('aPagado').value = t ? sep(t) : '';
  var desc = SUMA - num($('aPagado').value);
  $('aDesc').textContent = pagadoEditado && desc > 0 ? '🏷️ Descuento: ' + fmt(desc) : (pagadoEditado && desc < 0 ? '⚠️ Pagó ' + fmt(-desc) + ' más que la suma' : '');
}
var SUMA = 0, pagadoEditado = false;
$('aPagado').addEventListener('input', function(){
  var n = num($('aPagado').value); $('aPagado').value = n ? sep(n) : '';
  pagadoEditado = n > 0 && n !== SUMA; totalizar();
});
// Compara el precio escrito con lo que cobran los demás proveedores
function revisar(div){
  var p = div.querySelector('.lp').value.trim().toUpperCase(), u = div.querySelector('.lu').value.trim().toUpperCase();
  var precio = num(div.querySelector('.lv').value), cant = num(div.querySelector('.lc').value) || 1;
  var prov = $('aProv').value.trim().toUpperCase(), pista = div.querySelector('.pista');
  div.querySelector('.sub').textContent = precio ? cant + ' × ' + fmt(precio) + ' = ' + fmt(cant * precio) : '';
  totalizar();
  var prod = D.productos.filter(function(x){ return x.n === p && x.u === u; })[0];
  if (!p || !prod) { pista.hidden = !p; pista.className = 'pista info'; pista.textContent = '🆕 Producto nuevo: desde ahora queda guardado su precio'; return; }
  var otros = prod.ofertas.filter(function(o){ return o.prov !== prov; });
  var suyo = prod.ofertas.filter(function(o){ return o.prov === prov; })[0];
  if (!precio) {
    pista.hidden = false; pista.className = 'pista info';
    pista.textContent = (otros.length ? 'Más barato: ' + otros[0].prov + ' ' + fmt(otros[0].precio) : '') + (suyo ? (otros.length ? ' · ' : '') + 'La vez pasada ' + prov + ' lo dio a ' + fmt(suyo.precio) : '');
    pista.hidden = !pista.textContent; return;
  }
  var t = [];
  if (otros.length && otros[0].precio < precio) {
    pista.className = 'pista mal';
    t.push('⚠️ ' + otros[0].prov + ' lo da a ' + fmt(otros[0].precio) + ' (' + fmt(precio - otros[0].precio) + ' menos por unidad)');
  } else if (otros.length) {
    pista.className = 'pista bien'; t.push('✅ Es el precio más barato');
  } else pista.className = 'pista info';
  if (suyo && suyo.precio !== precio) t.push((precio > suyo.precio ? '📈 Subió ' : '📉 Bajó ') + fmt(Math.abs(precio - suyo.precio)) + ' desde la última vez (' + fmt(suyo.precio) + ')');
  pista.textContent = t.join(' · '); pista.hidden = !t.length;
}
function revisarTodas(){ [].forEach.call($('lineas').children, revisar); }
$('aProv').addEventListener('input', revisarTodas);

function limpiar(){
  $('aProv').value = ''; $('aNota').value = ''; $('lineas').innerHTML = ''; agregarLinea();
  fotoUrl = ''; $('avisoIA').hidden = true; pagadoEditado = false; totalizar();
  pago = 'Caja'; marcar('aPago', 'Caja'); totalizar(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('btnGuardar').addEventListener('click', function(){
  var lineas = [].map.call($('lineas').children, function(d){
    return { p: d.querySelector('.lp').value.trim(), u: d.querySelector('.lu').value.trim(), cant: num(d.querySelector('.lc').value) || 1, precio: num(d.querySelector('.lv').value) };
  }).filter(function(l){ return l.p || l.precio; });
  var d = { prov: $('aProv').value.trim(), fecha: $('aFecha').value, tipo: tipo, nota: $('aNota').value.trim(), lineas: lineas,
            pagar: !!pago && tipo === 'Compra', medio: pago, foto: fotoUrl, pagado: num($('aPagado').value) };
  if (!d.prov) { msg('Escriba el proveedor', 'err'); $('aProv').focus(); return; }
  if (!lineas.length) { msg('Agregue al menos un producto', 'err'); return; }
  var malo = lineas.filter(function(l){ return !l.p || !l.precio; })[0];
  if (malo) { msg('A un producto le falta el nombre o el precio', 'err'); return; }
  $('btnGuardar').disabled = true; msg('Guardando...');
  srv().withSuccessHandler(function(r){
    $('btnGuardar').disabled = false;
    msg('✅ ' + (tipo === 'Compra' ? 'Factura' : 'Cotización') + ' de ' + r.guardado.prov + ' guardada: ' + r.guardado.lineas + ' productos por ' + fmt(r.guardado.total) +
      (d.pagar ? '. Pago anotado.' : '') + (r.guardado.pedido ? ' El pedido de este proveedor quedó PAGADO.' : ''), 'ok');
    pintar(r); limpiar();
  }).withFailureHandler(function(e){
    $('btnGuardar').disabled = false; msg('No se guardó: ' + e.message, 'err');
  }).guardarFactura(d);
});

// ---------- Leer factura con IA ----------
var turnoIA = 0;
function avisoIA(t, c){ $('avisoIA').innerHTML = t; $('avisoIA').className = 'aviso ' + (c || ''); $('avisoIA').hidden = !t; }
// Achica la foto para que suba rápido (máximo 1600 px)
function achicar(file, listo){
  var img = new Image(), url = URL.createObjectURL(file);
  img.onload = function(){
    var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    listo(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
  };
  img.onerror = function(){ avisoIA('No se pudo abrir la foto. Intente otra vez.', 'err'); };
  img.src = url;
}
$('btnIA').addEventListener('click', function(){ $('fotoIA').value = ''; $('fotoIA').click(); });
$('fotoIA').addEventListener('change', function(){
  var f = $('fotoIA').files[0];
  if (!f) return;
  $('btnIA').disabled = true;
  avisoIA('⏳ Leyendo la factura... puede tardar hasta 1 minuto. No cierre esta pantalla.');
  achicar(f, function(b64){
    var turno = ++turnoIA;
    // Si en 2 minutos no responde, se libera el botón para no quedar esperando
    setTimeout(function(){
      if (turno !== turnoIA || !$('btnIA').disabled) return;
      $('btnIA').disabled = false;
      avisoIA('⏱️ La IA está tardando demasiado. Toque el botón morado otra vez o anote la factura a mano.', 'err');
    }, 120000);
    srv().withSuccessHandler(function(r){
      if (turno !== turnoIA) return;
      $('btnIA').disabled = false;
      if (!r.lineas.length) { avisoIA('La IA no encontró productos. Tome la foto más de cerca, derecha y con buena luz.', 'err'); return; }
      tipo = 'Compra'; marcar('aTipo', 'Compra'); $('boxPago').hidden = false; $('btnGuardar').textContent = 'GUARDAR FACTURA';
      if (r.prov) $('aProv').value = r.prov;
      if (r.numero) $('aNota').value = r.numero;
      // La fecha de la factura solo se usa si es de esta semana; si es vieja, el pago queda con fecha de hoy
      if (r.fecha && r.fecha <= hoy() && (new Date(hoy()) - new Date(r.fecha)) / 864e5 <= 7) $('aFecha').value = r.fecha;
      else { $('aFecha').value = hoy(); if (r.fecha) $('aNota').value = ($('aNota').value + ' (factura del ' + r.fecha.split('-').reverse().join('/') + ')').trim(); }
      fotoUrl = r.foto || '';
      $('lineas').innerHTML = ''; pagadoEditado = false;
      r.lineas.forEach(function(l){ agregarLinea(l); });
      totalizar();
      var suma = r.lineas.reduce(function(s, l){ return s + (l.cant || 1) * l.precio; }, 0);
      var t = '✅ La IA leyó <b>' + r.lineas.length + ' productos</b>. Revise cada uno antes de guardar.';
      if (r.total && r.total < suma && r.total >= suma * 0.7) {
        $('aPagado').value = sep(r.total); pagadoEditado = true; totalizar();
        t += '<br>🏷️ La factura trae un descuento de <b>' + fmt(suma - r.total) + '</b>: el pago queda por <b>' + fmt(r.total) + '</b>.';
      } else if (r.total && Math.abs(r.total - suma) > r.total * 0.01) t += '<br>⚠️ La factura dice total <b>' + fmt(r.total) + '</b> y la suma da <b>' + fmt(suma) + '</b>: revise cantidades y precios.';
      if (fotoUrl) t += '<br><a href="' + esc(fotoUrl) + '" target="_blank" rel="noopener">📄 Ver la foto guardada</a>';
      avisoIA(t, 'ok');
    }).withFailureHandler(function(e){
      if (turno !== turnoIA) return;
      $('btnIA').disabled = false; avisoIA('❌ ' + esc(e.message), 'err');
    }).leerFactura(b64, 'image/jpeg');
  });
});

function cargar(){
  srv().withSuccessHandler(pintar)
    .withFailureHandler(function(e){ msg('Error: ' + e.message, 'err'); })
    .precios();
}
$('aFecha').value = hoy();
$('btnGuardar').textContent = 'GUARDAR FACTURA';
iniciar(cargar);
</script>
</body>
</html>
